{% extends "base.html" %}{% block content %}<h1>Shopping Cart</h1>{% for x in items %}<div class="row"><b>{{x.product.name}}</b><span>{{x.quantity}} × ₹{{x.product.price}} = ₹{{x.subtotal}}</span><a href="{% url 'remove_from_cart' x.product.id %}">Remove</a></div>{% empty %}<p>Your cart is empty.</p>{% endfor %}<h2>Total: ₹{{total}}</h2>{% if items %}<a class="btn" href="{% url 'checkout' %}">Checkout</a>{% endif %}{% endblock %}
